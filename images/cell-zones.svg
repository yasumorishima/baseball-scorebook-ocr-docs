<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif">
  <rect width="720" height="440" fill="#ffffff"/>
  <!-- the cell -->
  <rect x="190" y="40" width="340" height="340" fill="#fbfbfd" stroke="#333" stroke-width="2"/>
  <!-- count strip -->
  <rect x="190" y="40" width="34" height="340" fill="#eef1f6" stroke="#333" stroke-width="1"/>
  <g fill="#6b7280"><circle cx="207" cy="80" r="4"/><circle cx="207" cy="100" r="4"/><circle cx="207" cy="120" r="4" fill="none" stroke="#6b7280"/><rect x="200" y="137" width="14" height="3"/></g>
  <!-- quadrant lines -->
  <g stroke="#9aa3b2" stroke-dasharray="5 5">
    <line x1="377" y1="40" x2="377" y2="380"/>
    <line x1="224" y1="210" x2="530" y2="210"/>
  </g>
  <!-- diamond -->
  <polygon points="377,120 467,210 377,300 287,210" fill="#ffffff" stroke="#9aa3b2" stroke-dasharray="5 5" stroke-width="1.5"/>
  <!-- corner labels inside the cell -->
  <g font-size="20" fill="#1f2937" text-anchor="middle">
    <text x="455" y="100">二塁</text>
    <text x="300" y="100">三塁</text>
    <text x="300" y="335">本塁</text>
    <text x="455" y="320">一塁</text>
    <text x="455" y="346" font-size="15" fill="#b35c00">（打者の結果）</text>
  </g>
  <g font-size="15" fill="#374151" text-anchor="middle">
    <text x="377" y="205">アウトの数字</text>
    <text x="377" y="226">得点の丸・残塁の印</text>
  </g>
  <!-- outside callouts -->
  <g font-size="16" fill="#374151">
    <text x="20" y="96">球のカウント</text>
    <text x="20" y="117">（点・丸・線）</text>
  </g>
  <line x1="130" y1="104" x2="196" y2="104" stroke="#6b7280" stroke-width="1.5"/>
  <g font-size="15" fill="#374151">
    <text x="548" y="86">二塁・三塁・本塁の角</text><text x="548" y="106">＝その塁へ進んだ理由</text>
    <text x="548" y="126">（番号・S・WP など）</text>
    <text x="548" y="322">安打・四球・ゴロ</text>
    <text x="548" y="342">・フライ・失策</text>
  </g>
  <text x="360" y="420" font-size="15" fill="#6b7280" text-anchor="middle">1 マス ＝ 1 打席（打順の行 × 回の列）</text>
</svg>
